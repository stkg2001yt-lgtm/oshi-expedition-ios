name: StudyCommunity
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES

targets:
  StudyCommunity:
    type: application
    platform: iOS
    sources:
      - path: StudyCommunity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StudyCommunity
        INFOPLIST_FILE: StudyCommunity/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
